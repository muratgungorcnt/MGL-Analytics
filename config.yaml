# BIST (Istanbul Stock Exchange) Tracking
bist:
  enabled: true
  check_interval: 3600
  symbols:
    THYAO: "Turkish Airlines"
    EREGL: "Eregli Iron Steel"
    ASELS: "Aselsan"
    GARAN: "Garanti BBVA"
    AKBNK: "Akbank"
    ISCTR: "Is Bank"
    YKBNK: "Yapi Kredi"
    VAKBN: "Vakifbank"
    HALKB: "Halk Bank"
    KCHOL: "Koc Holding"
    SAHOL: "Sabanci Holding"
    SISE: "Sisecam"
    TUPRS: "Tupras"
    PETKM: "Petkim"
    PGSUS: "Pegasus"
    BIMAS: "BIM Magazalar"
    EKGYO: "Emlak Konut"
    HEKTS: "Hektas"
    SASA: "Sasa Polyester"
    TCELL: "Turkcell"
    AEFES: "Anadolu Efes"
    AKENR: "Akenerji"
    AKSA: "Aksa Acrylic"
    AKSGY: "Aksigorta"
    ARCLK: "Arcelik"
    ENKAI: "Enkai Construction"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file:
    enabled: true
    directory: "logs"
    rotation: "daily"
    retention_days: 30

# System Configuration
system:
  timezone: "Europe/Istanbul"
  test_mode: false
  debug_mode: false
  max_workers: 10
  graceful_shutdown_timeout: 30

# Notification Configuration
notifications:
  telegram_enabled: true
  emoji_enabled: true
  include_full_analysis: true
